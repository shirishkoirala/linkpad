name: linkpad_controller
description: Local network touchpad controller for Linkpad.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  tray_manager: ^0.3.2
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  assets:
    - assets/branding/tray-icon.png
    - assets/branding/linkpad-icon-source.png
  uses-material-design: true
