name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        shell: python
        run: |
          import os, re
          from pathlib import Path
          text = Path('mobile/pubspec.yaml').read_text()
          version = re.search(r'^version:\s*(\S+)', text, re.M)[1].split('+')[0]
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?', version):
              raise SystemExit('Invalid desktop release version')
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit('Tag must match the version in mobile/pubspec.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev dpkg-dev
      - run: flutter pub get
        working-directory: mobile
      - run: go test -race ./...
      - run: go vet ./...
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --concurrency=1
        working-directory: mobile
      - name: Build Linux bundle and installer
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release
          python3 tool/package_desktop.py linux
        working-directory: mobile
      - name: Build and package Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          variables=(MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)
          configured=0
          for name in "${variables[@]}"; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" == 0 ]]; then
            echo '::warning::No Mac signing secrets: producing a local testing DMG, not a notarized public installer.'
            python3 mobile/tool/package_desktop.py macos
            exit 0
          fi
          for name in "${variables[@]}"; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/linkpad-signing.keychain-db"
          certificate="$RUNNER_TEMP/linkpad-signing.p12"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$certificate"' EXIT
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "linkpad-signing.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"], validate=True))'
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          xcrun notarytool store-credentials linkpad-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          python3 mobile/tool/package_desktop.py macos --identity "$MACOS_SIGNING_IDENTITY" --notary-profile linkpad-ci
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            bin/releases/*.deb
            bin/releases/*.dmg
            bin/releases/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Verify installer checksums
        working-directory: installers
        run: |
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          cat > notes.md <<'NOTES'
          Linkpad desktop companion for the Android and iOS controllers.

          - Linux: x86_64 Debian package for Ubuntu 24.04 / Linux Mint 22-compatible systems. Input requires an X11 desktop session.
          - Mac: drag Linkpad into Applications, open it, and grant Accessibility permission.
          - Pair your phone by scanning the desktop QR code on the same local network.
          - SHA-256 checksum files accompany the installers.

          Before publishing, test fresh installation, upgrades, discovery, pairing and reconnect on physical desktops. Windows is not included in this release workflow.
          NOTES
          if compgen -G 'installers/*-macos-local.dmg' > /dev/null; then
            cat >> notes.md <<'NOTES'

          **Mac testing build:** the `macos-local.dmg` is ad-hoc signed and not notarized. Configure Developer ID and notarization secrets, then rerun the workflow before publishing a public Mac installer. Do not disable Gatekeeper.
          NOTES
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then echo 'Refusing to replace an already published release.'; exit 1; fi
            source=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            if [[ "$source" != "$GITHUB_SHA" ]]; then echo 'Draft uses another source commit; choose a new version or remove the old draft before retrying.'; exit 1; fi
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Linkpad $VERSION" --notes-file notes.md
          fi
          gh release upload "$tag" installers/* --clobber
