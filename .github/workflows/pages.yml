name: Deploy landing page

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'assets/release/screenshots/iOS/**'
      - 'assets/release/social-preview.png'
      - 'mobile/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read latest public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
      - name: Build static site
        run: python3 website/build.py "$RUNNER_TEMP/release.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: bin/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
