name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/linkpad
  stubs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/linkpad
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target }}
          GOARCH: amd64
  x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: xvfb-run -a go test -race ./internal/pointer
        env:
          LINKPAD_X11_INTEGRATION: '1'
          XDG_SESSION_TYPE: x11
